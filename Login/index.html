<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="./Estilo/estilo.css">
</head>
<body>
    <div class="container">
        <h1> Login</h1>
        <h3>Insira seu e-mail e sua senha.</h3>
        <input type="email" id="inptEmail" placeholder="Digite seu e-mail aqui">
        <input type="password" id="inptPassword" placeholder="Digite sua senha aqui">
        <button id="btnLogin" class="btn">Entrar</button>
        <h3>Não tem conta? Cadastre-se.</h3>
        <button id="btn" class="btn">Cadastro</button>
    </div>
    <script src="./Código/código.js"></script>
</body>
</html>
