<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" href="./Estilizacao/estlizacao.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro</h1>
        <h3>Insira um e-mail e uma senha</h3>
        <h3>Para criar sua conta</h3>
        <input type="email" id="email" placeholder="insira um e-mail aqui">
        <input type="password" id="password" placeholder="Insira uma senha aqui">
        <input type="password" id="confirmarPassword" placeholder="Confirmar Senha">
        <button id="btnCadastro" class="btn">Criar Conta</button>
    </div>
  <script src="./Script/script.js"></script>
</body>
</html>
